name: Read-only audit of photo visibility across 10 family sites
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-current-family-photos.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hays-botany-current-family-gallery-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verifier
        run: python -m pip install 'Pillow>=10,<13'
      - name: Check the 10 current source galleries against live Pages and individual photo URLs
        run: |
          python -m py_compile scripts/verify_live_photo_galleries.py
          python scripts/verify_live_photo_galleries.py
      - name: Preserve exact per-family audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ten-live-family-photo-verification
          path: qa-report/live-photo-galleries.json
          retention-days: 30
          if-no-files-found: warn
