name: Test hub search, family routes, browser Back and mobile breakpoints
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'data/species-index.json'
      - 'data/collections.json'
      - 'scripts/test_hub_browser.cjs'
      - '.github/workflows/test-hub-mobile-navigation.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: hays-hub-live-mobile-browser-qa
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test real published hub in Chromium on mobile/tablet/desktop
        run: node scripts/test_hub_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-hub-browser-qa-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
