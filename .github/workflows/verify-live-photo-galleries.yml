name: Verify current photo galleries on all 10 live family websites
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_live_photo_galleries.py'
      - '.github/workflows/verify-live-photo-galleries.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hays-botany-current-live-photo-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder and check audit script syntax
        run: |
          python -m pip install 'Pillow>=10,<13'
          python -m py_compile scripts/verify_live_photo_galleries.py
      - name: Compare all 10 main-branch gallery indexes with public Pages, verify cards, photo credits and image URLs
        run: python scripts/verify_live_photo_galleries.py
      - name: Save cross-family live-gallery verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-ten-family-live-photo-audit
          path: qa-report/live-photo-galleries.json
          retention-days: 30
          if-no-files-found: warn
