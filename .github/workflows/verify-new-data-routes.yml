name: Verify 146-family new-data intake destinations (no writes)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_new_data_routes.py'
      - '.github/workflows/verify-new-data-routes.yml'
      - 'data/collections.json'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  route-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify live destination branches and unchanged original-hub freeze
        run: python3 scripts/verify_new_data_routes.py
